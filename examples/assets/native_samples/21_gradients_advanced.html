<!DOCTYPE html>
<html>
<head>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", sans-serif; padding: 24px; }
    h2 { font-size: 20px; color: #38bdf8; margin-bottom: 16px; }
    h3 { font-size: 14px; color: #94a3b8; margin: 16px 0 8px; }
    .section { background: #1e293b; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
    .swatch { width: 140px; height: 100px; border-radius: 8px; }
    .label { font-size: 11px; color: #64748b; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
    <h2>Advanced Gradients</h2>

    <h3>Conic Gradients</h3>
    <div class="section">
        <div class="row">
            <div>
                <div class="swatch" style="background: conic-gradient(#ef4444, #f59e0b, #10b981, #3b82f6, #8b5cf6, #ef4444);"></div>
                <div class="label">color wheel</div>
            </div>
            <div>
                <div class="swatch" style="background: conic-gradient(from 90deg, #3b82f6, #8b5cf6);"></div>
                <div class="label">from 90deg</div>
            </div>
            <div>
                <div class="swatch" style="background: conic-gradient(#1e293b 25%, #3b82f6 25% 50%, #1e293b 50% 75%, #8b5cf6 75%); border-radius: 50%;"></div>
                <div class="label">pie chart</div>
            </div>
        </div>
    </div>

    <h3>Repeating Linear Gradients</h3>
    <div class="section">
        <div class="row">
            <div>
                <div class="swatch" style="background: repeating-linear-gradient(45deg, #3b82f6 0%, #3b82f6 10%, #1e293b 10%, #1e293b 20%);"></div>
                <div class="label">diagonal stripes</div>
            </div>
            <div>
                <div class="swatch" style="background: repeating-linear-gradient(0deg, #ef4444 0px, #ef4444 4px, transparent 4px, transparent 8px);"></div>
                <div class="label">horizontal lines</div>
            </div>
            <div>
                <div class="swatch" style="background: repeating-linear-gradient(90deg, #10b981 0%, #10b981 5%, #064e3b 5%, #064e3b 10%);"></div>
                <div class="label">vertical bars</div>
            </div>
        </div>
    </div>

    <h3>Repeating Radial Gradients</h3>
    <div class="section">
        <div class="row">
            <div>
                <div class="swatch" style="background: repeating-radial-gradient(#3b82f6 0%, #3b82f6 10%, #1e293b 10%, #1e293b 20%);"></div>
                <div class="label">concentric rings</div>
            </div>
            <div>
                <div class="swatch" style="background: repeating-radial-gradient(#f59e0b 0px, #f59e0b 6px, transparent 6px, transparent 12px);"></div>
                <div class="label">dotted pattern</div>
            </div>
        </div>
    </div>

    <h3>Linear Gradient Directions</h3>
    <div class="section">
        <div class="row">
            <div>
                <div class="swatch" style="background: linear-gradient(to right, #ef4444, #3b82f6);"></div>
                <div class="label">to right</div>
            </div>
            <div>
                <div class="swatch" style="background: linear-gradient(to bottom right, #10b981, #f59e0b);"></div>
                <div class="label">to bottom right</div>
            </div>
            <div>
                <div class="swatch" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"></div>
                <div class="label">135deg</div>
            </div>
            <div>
                <div class="swatch" style="background: linear-gradient(to top, #0f172a, #38bdf8);"></div>
                <div class="label">to top</div>
            </div>
        </div>
    </div>
</body>
</html>
