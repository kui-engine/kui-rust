<!DOCTYPE html>
<html>
<head>
<style>
    body { background: #1e293b; color: #e2e8f0; font-family: "Segoe UI", sans-serif; padding: 24px; }
    h3 { margin: 16px 0 8px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }

    textarea {
        width: 300px;
        height: 80px;
        padding: 8px;
        font-size: 14px;
        background: #0f172a;
        color: #e2e8f0;
        border: 2px solid #334155;
        border-radius: 4px;
    }
    textarea:focus {
        border-color: #3b82f6;
    }
</style>
</head>
<body>
    <h3>Textarea Test</h3>
    <textarea placeholder="Type here..."></textarea>

    <h3>Checkbox Test</h3>
    <div class="row"><input type="checkbox" checked /> Checked</div>
    <div class="row"><input type="checkbox" /> Unchecked</div>

    <h3>Radio Test</h3>
    <div class="row"><input type="radio" name="test" checked /> Option A</div>
    <div class="row"><input type="radio" name="test" /> Option B</div>
</body>
</html>
