<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    padding: 20px;
}
h1 {
    color: #4facfe;
    font-size: 24px;
    margin-bottom: 16px;
}
h2 {
    color: #00f2fe;
    font-size: 18px;
    margin-top: 20px;
    margin-bottom: 10px;
}
.section {
    background: #16213e;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
}
.row {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
}
.card {
    background: #0f3460;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    min-width: 120px;
}
.card img {
    display: block;
    margin: 0 auto 8px auto;
}
.label {
    font-size: 12px;
    color: #aaa;
    margin-top: 4px;
}
.inline-svg {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #0f3460;
    border-radius: 6px;
    margin-bottom: 8px;
}
.bg-svg {
    width: 100px;
    height: 100px;
    background-image: url('sample_icon.svg');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border: 1px solid #333;
    border-radius: 8px;
}
.data-uri-svg {
    width: 64px;
    height: 64px;
}
</style>
</head>
<body>
    <h1>SVG Image Rendering Test</h1>

    <div class="section">
        <h2>1. SVG via &lt;img&gt; tag (file path)</h2>
        <div class="row">
            <div class="card">
                <img src="sample_icon.svg" style="width:80px; height:80px;">
                <div class="label">80x80 icon</div>
            </div>
            <div class="card">
                <img src="sample_star.svg" style="width:64px; height:64px;">
                <div class="label">64x64 star</div>
            </div>
            <div class="card">
                <img src="sample_icon.svg" style="width:40px; height:40px;">
                <div class="label">40x40 small</div>
            </div>
            <div class="card">
                <img src="sample_star.svg" style="width:32px; height:32px;">
                <div class="label">32x32 small</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>2. SVG via CSS background-image</h2>
        <div class="row">
            <div class="card">
                <div class="bg-svg"></div>
                <div class="label">background-image</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>3. SVG via data: URI</h2>
        <div class="row">
            <div class="card">
                <img class="data-uri-svg" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0Ij4KICA8cmVjdCB4PSI0IiB5PSI0IiB3aWR0aD0iNTYiIGhlaWdodD0iNTYiIHJ4PSIxMiIgZmlsbD0iIzZjNWNlNyIvPgogIDx0ZXh0IHg9IjMyIiB5PSI0MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1zaXplPSIyMCIgZmlsbD0id2hpdGUiIGZvbnQtd2VpZ2h0PSJib2xkIj5TVkc8L3RleHQ+Cjwvc3ZnPg==" style="width:64px; height:64px;">
                <div class="label">base64 data URI</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>4. SVG inline with text</h2>
        <div class="inline-svg">
            <img src="sample_star.svg" style="width:24px; height:24px;">
            <span>Star rating: Excellent!</span>
        </div>
        <div class="inline-svg">
            <img src="sample_icon.svg" style="width:24px; height:24px;">
            <span>KUI Framework v1.2</span>
        </div>
    </div>
</body>
</html>
