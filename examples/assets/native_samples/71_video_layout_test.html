<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a2e; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
h2 { color: #7ec8e3; }
.section { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
</style>
</head>
<body>
    <h2>Video Layout Test</h2>
    <div class="section">
        <p>Video with width=480 height=270:</p>
        <video id="v1" width="480" height="270" style="background:#000; border-radius:6px;" controls></video>
        <p>Video with width=320 height=180:</p>
        <video id="v2" width="320" height="180" style="background:#222; border:1px solid #555;"></video>
        <p>Video no attrs (default 300x150):</p>
        <video id="v3" style="background:#333; border:1px solid #666;"></video>
    </div>
</body>
</html>
