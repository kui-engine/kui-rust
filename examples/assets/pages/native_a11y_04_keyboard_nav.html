<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}.s{background:white;padding:16px;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.s h3{font-size:13px;color:#64748b;margin-bottom:8px}
.menu{list-style:none}.menu li{padding:10px 16px;border-radius:6px;font-size:14px;color:#475569;cursor:pointer;margin-bottom:2px}
.menu li:focus{background:#dbeafe;color:#1e40af;outline:2px solid #3b82f6;outline-offset:-2px}
.menu li:hover{background:#f1f5f9}
.key{display:inline-block;padding:2px 8px;border-radius:4px;background:#f1f5f9;border:1px solid #e2e8f0;font-family:monospace;font-size:12px;color:#475569}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:8px 12px;background:#f1f5f9;color:#475569;border-bottom:1px solid #e2e8f0;font-weight:600}
.tbl td{padding:8px 12px;border-bottom:1px solid #f1f5f9;color:#64748b}
</style></head><body><h2>Keyboard Navigation</h2>
<div class="s"><h3>Keyboard shortcuts</h3>
<table class="tbl">
<tr><th>Key</th><th>Action</th></tr>
<tr><td><span class="key">Tab</span></td><td>Next focusable element</td></tr>
<tr><td><span class="key">Shift+Tab</span></td><td>Previous element</td></tr>
<tr><td><span class="key">Enter</span></td><td>Activate element</td></tr>
<tr><td><span class="key">Space</span></td><td>Toggle / press</td></tr>
<tr><td><span class="key">Escape</span></td><td>Dismiss / close</td></tr>
<tr><td><span class="key">Arrows</span></td><td>Navigate widgets</td></tr>
</table></div>
<div class="s"><h3>Navigable menu (Tab / Arrow keys)</h3>
<ul class="menu">
<li tabindex="0">Dashboard</li><li tabindex="0">Projects</li>
<li tabindex="0">Team Members</li><li tabindex="0">Settings</li>
<li tabindex="0">Help</li></ul></div>
</body></html>
