<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.box{height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#475569;background:#f1f5f9;text-align:center}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:12px}
</style></head><body>
<h2>CSS Outline</h2>
<div class="card"><h3>Outline Styles</h3>
<div class="grid">
<div class="box" style="outline:2px solid #3b82f6">solid</div>
<div class="box" style="outline:2px dashed #10b981">dashed</div>
<div class="box" style="outline:2px dotted #f59e0b">dotted</div>
<div class="box" style="outline:3px double #ef4444">double</div>
<div class="box" style="outline:2px groove #8b5cf6">groove</div>
<div class="box" style="outline:2px ridge #ec4899">ridge</div>
</div></div>
<div class="card"><h3>Outline Offset</h3>
<div class="grid">
<div class="box" style="outline:2px solid #3b82f6;outline-offset:0">offset: 0</div>
<div class="box" style="outline:2px solid #3b82f6;outline-offset:4px">offset: 4px</div>
<div class="box" style="outline:2px solid #3b82f6;outline-offset:8px">offset: 8px</div>
</div>
<div class="info">Outline doesn't affect layout. outline-offset moves it from border edge.</div></div>
</body></html>
