<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:16px;font-family:"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc}
h2{margin-bottom:12px}
.con{background:#1e293b;border-radius:8px;overflow:hidden}
.con-hdr{background:#0f172a;padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #334155}
.dot{width:10px;height:10px;border-radius:50%}.dr{background:#ef4444}.dy{background:#f59e0b}.dg{background:#10b981}
.con-hdr .title{margin-left:8px;font-size:12px;color:#94a3b8}
.con-body{padding:12px;font-family:"Consolas",monospace;font-size:13px;max-height:300px;overflow-y:auto}
.log{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.li{color:#94a3b8}.li::before{content:"info ";color:#3b82f6}
.lw{color:#fbbf24;background:rgba(251,191,36,.05)}.lw::before{content:"warn "}
.le{color:#f87171;background:rgba(248,113,113,.05)}.le::before{content:"error "}
.btn-row{display:flex;gap:8px;padding:12px}
.btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.bi{background:#3b82f6;color:white}.bw{background:#f59e0b;color:#1e293b}
.be{background:#ef4444;color:white}.bc{background:#334155;color:#94a3b8}
</style></head><body><h2>Console Logging</h2>
<div class="con">
<div class="con-hdr"><div class="dot dr"></div><div class="dot dy"></div><div class="dot dg"></div><span class="title">KUI Console</span></div>
<div class="con-body" id="output">
<div class="log li">Application started</div><div class="log li">Window created: 800x600</div>
<div class="log li">DOM loaded (23 nodes)</div><div class="log li">CSS parsed: 45 rules</div>
<div class="log lw">Deprecated API: setInnerHTML</div><div class="log li">Layout: 12ms</div></div>
<div class="btn-row">
<button class="btn bi" id="btnI">Log Info</button><button class="btn bw" id="btnW">Log Warn</button>
<button class="btn be" id="btnE">Log Error</button><button class="btn bc" id="btnC">Clear</button>
</div></div></body></html>
