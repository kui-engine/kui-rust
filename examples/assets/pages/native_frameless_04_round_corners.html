<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:"Segoe UI",sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}
.window{background:#1e293b;border-radius:24px;overflow:hidden;width:460px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #334155}
.titlebar{display:flex;align-items:center;padding:12px 16px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.titlebar .title{flex:1;text-align:center;font-size:13px;color:#94a3b8;font-weight:500}
.content{padding:24px;text-align:center}
.content h2{font-size:20px;color:#f8fafc;margin-bottom:8px}
.content p{font-size:14px;color:#94a3b8;line-height:1.6;margin-bottom:16px}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.badge{padding:6px 14px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
</style></head><body>
<div class="window">
<div class="titlebar">
<div class="dot" style="background:#ef4444"></div>
<div class="dot" style="background:#f59e0b"></div>
<div class="dot" style="background:#10b981"></div>
<div class="title">Round Corners Window</div></div>
<div class="content">
<h2>Custom Window Shape</h2>
<p>Frameless window with CSS border-radius on root container + transparent background.</p>
<div class="badges">
<div class="badge">border-radius: 24px</div>
<div class="badge">transparent: true</div>
<div class="badge">frameless: true</div>
</div></div></div>
</body></html>
