<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;padding:24px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card p{color:#64748b;font-size:14px;margin-bottom:16px}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;margin-right:8px}
.bp{background:#3b82f6;color:white}.bd{background:#ef4444;color:white}
.bg{background:transparent;color:#64748b;border:1px solid #e2e8f0}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:white;border-radius:16px;padding:32px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:18px;color:#1e293b;margin-bottom:8px}.modal p{color:#64748b;font-size:14px;margin-bottom:20px}
.ma{display:flex;gap:8px;justify-content:flex-end}
.status{margin-top:16px;padding:12px;border-radius:8px;background:#f1f5f9;font-size:13px;color:#475569}
</style></head><body>
<h2>Modal Dialog</h2>
<div class="card"><p>Click buttons to open modal dialogs.</p>
<button class="btn bp" id="openC">Confirm Dialog</button>
<button class="btn bd" id="openD">Delete Dialog</button>
<div class="status" id="status">No action taken.</div></div>
<div class="overlay" id="ov">
<div class="modal"><h3 id="mT">Confirm</h3><p id="mM">Are you sure?</p>
<div class="ma"><button class="btn bg" id="canBtn">Cancel</button><button class="btn bp" id="okBtn">Confirm</button></div></div></div>
</body></html>
