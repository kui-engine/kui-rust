<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc}
h2{margin-bottom:16px}h3{font-size:13px;color:#94a3b8;margin-bottom:8px}
.row{display:flex;gap:12px;margin-bottom:16px}
.sw{width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:600}
.stack{position:relative;height:200px;margin-bottom:16px}
.layer{position:absolute;width:160px;height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600}
</style></head><body><h2>Opacity &amp; Layers</h2>
<h3>Opacity values</h3>
<div class="row">
<div class="sw" style="background:#3b82f6;opacity:1">1.0</div>
<div class="sw" style="background:#3b82f6;opacity:.8">0.8</div>
<div class="sw" style="background:#3b82f6;opacity:.6">0.6</div>
<div class="sw" style="background:#3b82f6;opacity:.4">0.4</div>
<div class="sw" style="background:#3b82f6;opacity:.2">0.2</div>
<div class="sw" style="background:#3b82f6;opacity:.1">0.1</div>
</div>
<h3>Stacked layers</h3>
<div class="stack">
<div class="layer" style="background:#ef4444;top:0;left:0;opacity:.7">Red</div>
<div class="layer" style="background:#3b82f6;top:30px;left:80px;opacity:.7">Blue</div>
<div class="layer" style="background:#10b981;top:60px;left:160px;opacity:.7">Green</div>
<div class="layer" style="background:#f59e0b;top:20px;left:240px;opacity:.5">Amber</div>
</div></body></html>
