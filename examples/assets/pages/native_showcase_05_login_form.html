<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:white;border-radius:20px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card h2{font-size:24px;color:#1e293b;margin-bottom:4px;text-align:center}
.card .sub{font-size:14px;color:#94a3b8;text-align:center;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#475569;font-weight:600;margin-bottom:6px}
.field input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;color:#1e293b}
.field input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.field input::placeholder{color:#cbd5e1}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px}
.row a{color:#3b82f6;text-decoration:none;cursor:pointer}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px}
.btn-primary{background:#3b82f6;color:white}
.btn-primary:hover{background:#2563eb}
.divider{text-align:center;color:#94a3b8;font-size:13px;margin:16px 0;position:relative}
.divider::before,.divider::after{content:"";position:absolute;top:50%;width:40%;height:1px;background:#e2e8f0}
.divider::before{left:0}.divider::after{right:0}
.btn-social{background:white;color:#475569;border:1px solid #e2e8f0}
.btn-social:hover{background:#f8fafc}
.footer{text-align:center;font-size:13px;color:#94a3b8;margin-top:16px}
.footer a{color:#3b82f6;text-decoration:none}
.msg{display:none;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;text-align:center}
.msg.show{display:block}
.msg-ok{background:#dcfce7;color:#166534}.msg-err{background:#fee2e2;color:#991b1b}
</style></head><body>
<div class="card">
<h2>Welcome Back</h2><div class="sub">Sign in to your account</div>
<div class="msg" id="msg"></div>
<div class="field"><label>Email</label><input type="text" id="email" placeholder="name@example.com"></div>
<div class="field"><label>Password</label><input type="text" id="pass" placeholder="Enter your password"></div>
<div class="row"><label style="font-size:13px;color:#475569;display:flex;align-items:center;gap:6px"><input type="checkbox"> Remember me</label><a>Forgot password?</a></div>
<button class="btn btn-primary" id="loginBtn">Sign In</button>
<div class="divider">or</div>
<button class="btn btn-social">Continue with Google</button>
<div class="footer">Don't have an account? <a>Sign up</a></div>
</div>
</body></html>
