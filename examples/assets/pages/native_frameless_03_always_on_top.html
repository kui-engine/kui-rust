<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#f8fafc;font-family:"Segoe UI",sans-serif}
.card{text-align:center;background:#1e293b;padding:32px 48px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h2{font-size:22px;margin-bottom:8px}
.card p{color:#94a3b8;font-size:14px;margin-bottom:16px}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:600}
.info{margin-top:16px;font-size:12px;color:#64748b}
</style></head><body>
<div class="card">
<h2>Always On Top</h2>
<p>This window stays above all other windows.</p>
<div class="badge">alwaysOnTop = true</div>
<div class="info">Try clicking other windows — this one stays visible.</div>
</div>
</body></html>
