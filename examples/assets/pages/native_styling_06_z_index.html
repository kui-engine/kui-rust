<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.stack{position:relative;height:250px;margin-bottom:8px}
.layer{position:absolute;width:160px;height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:12px;color:#475569}
.legend .dot{width:12px;height:12px;border-radius:3px}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:8px}
</style></head><body>
<h2>CSS z-index Stacking</h2>
<div class="card"><h3>Overlapping Layers</h3>
<div class="stack">
<div class="layer" style="top:0;left:0;z-index:1;background:#3b82f6">z-index: 1</div>
<div class="layer" style="top:30px;left:60px;z-index:2;background:#10b981">z-index: 2</div>
<div class="layer" style="top:60px;left:120px;z-index:3;background:#f59e0b">z-index: 3</div>
<div class="layer" style="top:90px;left:180px;z-index:4;background:#ef4444">z-index: 4</div>
<div class="layer" style="top:120px;left:240px;z-index:5;background:#8b5cf6">z-index: 5</div>
</div>
<div class="legend">
<div><div class="dot" style="background:#3b82f6"></div>z:1 (back)</div>
<div><div class="dot" style="background:#10b981"></div>z:2</div>
<div><div class="dot" style="background:#f59e0b"></div>z:3</div>
<div><div class="dot" style="background:#ef4444"></div>z:4</div>
<div><div class="dot" style="background:#8b5cf6"></div>z:5 (front)</div>
</div>
<div class="info">Higher z-index stacks on top. Only works on positioned elements.</div></div>
</body></html>
