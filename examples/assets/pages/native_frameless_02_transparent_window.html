<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border-radius:24px;padding:40px;border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;max-width:400px;color:white}
.glass h2{font-size:22px;margin-bottom:8px;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.glass p{font-size:14px;opacity:.8;margin-bottom:20px;line-height:1.5}
.badge{display:inline-block;padding:6px 16px;border-radius:20px;background:rgba(255,255,255,.2);font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);margin:4px}
.info{margin-top:16px;font-size:11px;opacity:.5}
</style></head><body>
<div class="glass">
<h2>Transparent Window</h2>
<p>Desktop shows through transparent areas. Glass effect uses backdrop-filter.</p>
<div class="badge">transparent = true</div>
<div class="badge">frameless = true</div>
<div class="badge">backdrop-filter: blur</div>
<div class="info">Semi-transparent backgrounds + backdrop-filter = frosted glass</div>
</div>
</body></html>
