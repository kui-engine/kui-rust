<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { padding: 24px; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; }
h2 { margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.card { background: #1e293b; border-radius: 12px; overflow: hidden; text-align: center; }
.preview { width: 100%; height: 100px; background: linear-gradient(135deg, #3b82f6, #ec4899);
           display: flex; align-items: center; justify-content: center; }
.preview span { font-size: 36px; }
.card .name { padding: 8px; font-size: 12px; color: #94a3b8; }
.f-blur .preview { filter: blur(4px); }
.f-brightness .preview { filter: brightness(1.5); }
.f-contrast .preview { filter: contrast(2); }
.f-grayscale .preview { filter: grayscale(100%); }
.f-hue .preview { filter: hue-rotate(90deg); }
.f-invert .preview { filter: invert(100%); }
.f-opacity .preview { filter: opacity(50%); }
.f-saturate .preview { filter: saturate(3); }
.f-sepia .preview { filter: sepia(100%); }
.f-drop .preview { filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.5)); }
.f-multi .preview { filter: brightness(1.2) contrast(1.1) saturate(1.3); }
.f-none .preview { filter: none; }
</style></head><body>
<h2>CSS Filters</h2>
<div class="grid">
  <div class="card f-none"><div class="preview"><span>★</span></div><div class="name">none (original)</div></div>
  <div class="card f-blur"><div class="preview"><span>★</span></div><div class="name">blur(4px)</div></div>
  <div class="card f-brightness"><div class="preview"><span>★</span></div><div class="name">brightness(1.5)</div></div>
  <div class="card f-contrast"><div class="preview"><span>★</span></div><div class="name">contrast(2)</div></div>
  <div class="card f-grayscale"><div class="preview"><span>★</span></div><div class="name">grayscale(100%)</div></div>
  <div class="card f-hue"><div class="preview"><span>★</span></div><div class="name">hue-rotate(90deg)</div></div>
  <div class="card f-invert"><div class="preview"><span>★</span></div><div class="name">invert(100%)</div></div>
  <div class="card f-saturate"><div class="preview"><span>★</span></div><div class="name">saturate(3)</div></div>
  <div class="card f-sepia"><div class="preview"><span>★</span></div><div class="name">sepia(100%)</div></div>
  <div class="card f-drop"><div class="preview"><span>★</span></div><div class="name">drop-shadow</div></div>
  <div class="card f-opacity"><div class="preview"><span>★</span></div><div class="name">opacity(50%)</div></div>
  <div class="card f-multi"><div class="preview"><span>★</span></div><div class="name">multi-filter</div></div>
</div>
</body></html>
