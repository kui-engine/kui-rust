<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:14px;color:#1e293b;margin-bottom:8px}
.card p{font-size:13px;color:#64748b;margin-bottom:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.bp{background:#3b82f6;color:white}.bg{background:#10b981;color:white}.by{background:#f59e0b;color:white}
.result{margin-top:12px;padding:12px;background:#f1f5f9;border-radius:8px;font-size:13px;color:#475569;font-family:"Consolas",monospace}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:12px}
</style></head><body>
<h2>File Dialog</h2>
<div class="card">
<h3>Open & Save Dialogs</h3>
<p>KUI provides native file dialog APIs for opening and saving files.</p>
<div class="btn-row">
<button class="btn bp" id="openBtn">Open File</button>
<button class="btn bg" id="saveBtn">Save File</button>
<button class="btn by" id="folderBtn">Select Folder</button>
</div>
<div class="result" id="result">No file selected.</div>
</div>
<div class="card">
<h3>API</h3>
<div class="info">Platform::openFileDialog() and Platform::saveFileDialog() show native OS dialogs with customizable filters.</div>
</div>
</body></html>
