<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc}
.app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:48px 1fr;height:100vh;gap:1px;background:#1e293b}
.hdr{grid-column:1/-1;background:#0f172a;display:flex;align-items:center;padding:0 16px;gap:12px}
.hdr .logo{font-size:16px;font-weight:700;color:#3b82f6}
.hdr .av{width:28px;height:28px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:12px;margin-left:auto}
.sb{background:#0f172a;padding:8px;display:flex;flex-direction:column;gap:2px}
.sb .it{padding:8px 12px;border-radius:6px;font-size:13px;color:#94a3b8;cursor:pointer}
.sb .it.a{background:#1e293b;color:#f8fafc}
.mn{background:#0f172a;padding:12px;overflow:auto}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cd{background:#1e293b;border-radius:8px;padding:14px}
.cd .m{font-size:22px;font-weight:700}.cd .l{font-size:11px;color:#64748b;margin-top:2px}
.cd .br{height:4px;border-radius:2px;background:#334155;margin-top:6px}
.cd .br .f{height:100%;border-radius:2px}
</style></head><body>
<div class="app">
<div class="hdr"><div class="logo">KUI</div><div class="av">U</div></div>
<div class="sb"><div class="it a">Dashboard</div><div class="it">Analytics</div><div class="it">Reports</div><div class="it">Settings</div></div>
<div class="mn"><div class="cg">
<div class="cd"><div class="m">1,234</div><div class="l">Users</div><div class="br"><div class="f" style="width:72%;background:#3b82f6"></div></div></div>
<div class="cd"><div class="m">$48.2K</div><div class="l">Revenue</div><div class="br"><div class="f" style="width:85%;background:#10b981"></div></div></div>
<div class="cd"><div class="m">326</div><div class="l">Orders</div><div class="br"><div class="f" style="width:56%;background:#f59e0b"></div></div></div>
<div class="cd"><div class="m">98.5%</div><div class="l">Uptime</div><div class="br"><div class="f" style="width:98%;background:#8b5cf6"></div></div></div>
</div></div></div>
</body></html>
