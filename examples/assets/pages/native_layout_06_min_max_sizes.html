<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.bar{height:40px;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;color:white;margin-bottom:8px}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#dbeafe;color:#1e40af;margin-right:4px}
</style></head><body>
<h2>Min/Max Width & Height</h2>
<div class="card"><h3>min-width</h3>
<div class="bar" style="width:20%;min-width:200px;background:#3b82f6">width:20% min-width:200px</div>
<div class="bar" style="width:60%;min-width:200px;background:#60a5fa">width:60% min-width:200px</div>
<div class="info"><span class="tag">min-width</span> Never shrinks below minimum</div></div>
<div class="card"><h3>max-width</h3>
<div class="bar" style="width:100%;max-width:400px;background:#10b981">width:100% max-width:400px</div>
<div class="bar" style="width:100%;max-width:300px;background:#34d399">width:100% max-width:300px</div>
<div class="bar" style="width:100%;max-width:200px;background:#6ee7b7">width:100% max-width:200px</div>
<div class="info"><span class="tag">max-width</span> Never grows beyond maximum</div></div>
</body></html>
