<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc}
h2{margin-bottom:16px}
.card{background:#1e293b;border-radius:12px;padding:24px;margin-bottom:16px}
.card h3{font-size:14px;margin-bottom:12px}
.input-row{display:flex;gap:8px;margin-bottom:12px}
.input-row input{flex:1;padding:10px 14px;border:2px solid #334155;border-radius:8px;background:#0f172a;color:#f8fafc;font-size:14px}
.input-row input:focus{border-color:#3b82f6;outline:none}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.bp{background:#3b82f6;color:white}.bg{background:#10b981;color:white}
.result{background:#0f172a;padding:12px;border-radius:8px;font-size:13px;color:#94a3b8;min-height:40px;margin-top:8px}
.info{font-size:12px;color:#64748b;margin-top:8px}
</style></head><body>
<h2>Clipboard</h2>
<div class="card"><h3>Copy to Clipboard</h3>
<div class="input-row"><input type="text" id="copyInput" value="Hello from KUI!" placeholder="Text to copy"><button class="btn bp" id="copyBtn">Copy</button></div>
<div class="info">Click Copy to write text to system clipboard.</div></div>
<div class="card"><h3>Paste from Clipboard</h3>
<button class="btn bg" id="pasteBtn">Paste</button>
<div class="result" id="pasteResult">Pasted content will appear here...</div>
<div class="info">Click Paste to read text from system clipboard.</div></div>
</body></html>
