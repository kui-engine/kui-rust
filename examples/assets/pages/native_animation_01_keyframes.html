<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; justify-content: center;
       align-items: center; min-height: 100vh; background: #0f172a; font-family: "Segoe UI", sans-serif; }
.demo { text-align: center; width: 160px; }
.demo .label { font-size: 12px; color: #94a3b8; margin-top: 8px; }
.box { width: 60px; height: 60px; border-radius: 8px; margin: 20px auto; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
@keyframes colorShift { 0% { background: #3b82f6; } 33% { background: #10b981; } 66% { background: #f59e0b; } 100% { background: #3b82f6; } }
@keyframes slideIn { from { transform: translateX(-100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
@keyframes fadeInOut { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
@keyframes grow { 0% { width: 20px; height: 20px; } 50% { width: 80px; height: 80px; } 100% { width: 20px; height: 20px; } }
.a-spin { background: #3b82f6; animation: spin 2s linear infinite; }
.a-pulse { background: #10b981; animation: pulse 1.5s ease-in-out infinite; }
.a-bounce { background: #f59e0b; animation: bounce 1s ease-in-out infinite; }
.a-color { animation: colorShift 3s ease infinite; }
.a-slide { background: #8b5cf6; animation: slideIn 1s ease forwards; }
.a-shake { background: #ef4444; animation: shake 0.5s ease-in-out infinite; }
.a-fade { background: #ec4899; animation: fadeInOut 2s ease infinite; }
.a-grow { background: #06b6d4; animation: grow 2s ease-in-out infinite; }
</style></head><body>
<div class="demo"><div class="box a-spin"></div><div class="label">Spin</div></div>
<div class="demo"><div class="box a-pulse"></div><div class="label">Pulse</div></div>
<div class="demo"><div class="box a-bounce"></div><div class="label">Bounce</div></div>
<div class="demo"><div class="box a-color"></div><div class="label">Color Shift</div></div>
<div class="demo"><div class="box a-slide"></div><div class="label">Slide In</div></div>
<div class="demo"><div class="box a-shake"></div><div class="label">Shake</div></div>
<div class="demo"><div class="box a-fade"></div><div class="label">Fade</div></div>
<div class="demo"><div class="box a-grow"></div><div class="label">Grow</div></div>
</body></html>
