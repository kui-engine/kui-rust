<!DOCTYPE html>
<html>
<head>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
        font-family: "Segoe UI", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        padding: 32px;
        overflow-y: auto;
    }

    .hero {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
    }
    .hero-icon {
        width: 72px; height: 72px;
        border-radius: 16px;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        display: flex; align-items: center; justify-content: center;
        font-size: 36px;
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }
    .hero-title  { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .hero-sub    { font-size: 14px; color: #94a3b8; }

    .status-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
        padding: 14px 18px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid #334155;
        border-radius: 12px;
        font-size: 13px;
    }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .status-dot  {
        width: 10px; height: 10px; border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }
    .status-dot.off { background: #64748b; box-shadow: none; }
    .status-key { color: #94a3b8; }
    .status-val { color: #e2e8f0; font-weight: 600; }

    .card {
        background: rgba(30, 41, 59, 0.65);
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 22px;
        margin-bottom: 20px;
    }
    .card-title {
        font-size: 13px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 16px;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
        padding: 10px 18px;
        background: #3b82f6;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        border: none;
        transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover  { background: #2563eb; }
    .btn:active { transform: scale(0.97); }
    .btn.secondary { background: #475569; }
    .btn.secondary:hover { background: #64748b; }
    .btn.danger    { background: #ef4444; }
    .btn.danger:hover    { background: #dc2626; }

    .counters {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
    .counter-box {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 14px;
        text-align: center;
    }
    .counter-val { font-size: 24px; font-weight: 800; color: #60a5fa; }
    .counter-lbl { font-size: 11px; color: #94a3b8; margin-top: 4px; }

    #logList {
        list-style: none;
        font-family: "Consolas", "Cascadia Code", monospace;
        font-size: 12px;
        color: #cbd5e1;
        max-height: 220px;
        overflow-y: auto;
    }
    #logList li {
        padding: 6px 8px;
        border-bottom: 1px solid #1e293b;
    }
    #logList li:first-child { color: #60a5fa; font-weight: 600; }

    .hint {
        font-size: 12px;
        color: #94a3b8;
        line-height: 1.6;
        margin-top: 10px;
    }
    .hint kbd {
        display: inline-block;
        padding: 2px 6px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 4px;
        font-family: "Consolas", monospace;
        font-size: 11px;
        color: #e2e8f0;
    }
</style>
</head>
<body>
    <div class="hero">
        <div class="hero-icon">◎</div>
        <div>
            <div class="hero-title">System Tray Demo</div>
            <div class="hero-sub">ENH-P1-003 · 完整 TrayIcon API 演示 · KUI Framework</div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <div class="status-dot" id="statusBadge"></div>
            <span class="status-key">Tray</span>
            <span class="status-val" id="statusText">active</span>
        </div>
        <div class="status-item">
            <span class="status-key">Tooltip</span>
            <span class="status-val" id="tooltipLabel">Idle</span>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Actions</div>
        <div class="actions">
            <button class="btn"          id="btnBalloonInfo">  Balloon: Info</button>
            <button class="btn"          id="btnBalloonWarn">  Balloon: Warning</button>
            <button class="btn danger"   id="btnBalloonError"> Balloon: Error</button>
            <button class="btn secondary"id="btnToggleTooltip">Cycle Tooltip</button>
            <button class="btn secondary"id="btnToggleVisible">Hide Tray</button>
        </div>
        <div class="hint">
            右键托盘图标可弹出系统菜单。关闭窗口(<kbd>×</kbd>)将最小化到托盘
            而非退出;双击托盘可恢复窗口,或点击菜单 <b>Quit</b> 真正退出程序。
        </div>
    </div>

    <div class="card">
        <div class="card-title">Event Counters</div>
        <div class="counters">
            <div class="counter-box">
                <div class="counter-val" id="cntClick">0</div>
                <div class="counter-lbl">Left Click</div>
            </div>
            <div class="counter-box">
                <div class="counter-val" id="cntDouble">0</div>
                <div class="counter-lbl">Double Click</div>
            </div>
            <div class="counter-box">
                <div class="counter-val" id="cntRight">0</div>
                <div class="counter-lbl">Right Click</div>
            </div>
            <div class="counter-box">
                <div class="counter-val" id="cntBalloon">0</div>
                <div class="counter-lbl">Balloon Click</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Event Log (latest 10)</div>
        <ul id="logList">
            <li>ready — waiting for tray events…</li>
        </ul>
    </div>
</body>
</html>
