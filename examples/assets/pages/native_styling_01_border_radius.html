<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{height:100px;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:600;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.shape{width:120px;height:120px;display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:600;text-align:center;margin:0 auto}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:12px}
</style></head><body>
<h2>Border Radius Variants</h2>
<div class="card"><h3>Uniform Radius</h3>
<div class="grid">
<div class="box" style="border-radius:0;background:#3b82f6">0px</div>
<div class="box" style="border-radius:4px;background:#3b82f6">4px</div>
<div class="box" style="border-radius:8px;background:#3b82f6">8px</div>
<div class="box" style="border-radius:16px;background:#3b82f6">16px</div>
<div class="box" style="border-radius:24px;background:#10b981">24px</div>
<div class="box" style="border-radius:32px;background:#10b981">32px</div>
<div class="box" style="border-radius:50px;background:#10b981">50px</div>
<div class="box" style="border-radius:50%;background:#10b981">50%</div>
</div></div>
<div class="card"><h3>Individual Corners & Shapes</h3>
<div class="grid2">
<div class="shape" style="border-radius:50% 0;background:#f59e0b">50% 0</div>
<div class="shape" style="border-radius:20px 60px 20px 60px;background:#ef4444">20 60 20 60</div>
<div class="shape" style="border-radius:50% 50% 0 0;background:#8b5cf6">half circle</div>
<div class="shape" style="border-radius:40% 60% 70% 30%/40% 40% 60% 60%;background:#ec4899">organic blob</div>
<div class="shape" style="border-radius:0 50% 50% 0;background:#14b8a6">0 50% 50% 0</div>
<div class="shape" style="border-radius:30% 70% 70% 30%/30% 30% 70% 70%;background:#6366f1">pebble</div>
</div>
<div class="info">border-radius accepts 1-4 values, with / for horizontal/vertical radii. 50% creates circles.</div></div>
</body></html>
