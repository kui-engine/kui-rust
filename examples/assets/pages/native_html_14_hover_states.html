<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { padding: 24px; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; }
h2 { margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.card { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center;
        cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; }
.card:hover { background: #334155; border-color: #3b82f6; transform: translateY(-4px);
              box-shadow: 0 12px 24px rgba(0,0,0,0.3); }
.card:active { transform: translateY(0); }
.card h3 { font-size: 16px; margin-bottom: 8px; }
.card p { font-size: 13px; color: #94a3b8; }
.btn-row { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; cursor: pointer;
       transition: all 0.2s ease; font-weight: 600; border: none; }
.btn-primary { background: #3b82f6; color: white; }
.btn-primary:hover { background: #2563eb; box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
.btn-danger { background: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: transparent; color: #3b82f6; border: 2px solid #3b82f6; }
.btn-outline:hover { background: #3b82f6; color: white; }
.btn-ghost { background: transparent; color: #94a3b8; }
.btn-ghost:hover { background: #1e293b; color: #f8fafc; }
</style></head><body>
<h2>Hover &amp; Interactive States</h2>
<div class="grid">
  <div class="card"><h3>Analytics</h3><p>View detailed reports</p></div>
  <div class="card"><h3>Settings</h3><p>Configure preferences</p></div>
  <div class="card"><h3>Users</h3><p>Manage team members</p></div>
  <div class="card"><h3>Storage</h3><p>Monitor disk usage</p></div>
  <div class="card"><h3>Security</h3><p>Review access logs</p></div>
  <div class="card"><h3>Billing</h3><p>Manage subscriptions</p></div>
</div>
<h2 style="margin-top:24px;">Button Variants</h2>
<div class="btn-row">
  <button class="btn btn-primary">Primary</button>
  <button class="btn btn-danger">Danger</button>
  <button class="btn btn-outline">Outline</button>
  <button class="btn btn-ghost">Ghost</button>
</div>
</body></html>
