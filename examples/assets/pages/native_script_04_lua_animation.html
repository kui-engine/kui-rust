<!doctype html><html><head><style>
body{margin:0;padding:36px;background:#0f172a;color:#e2e8f0;font-family:Segoe UI,sans-serif}.card{max-width:720px;margin:auto}
#output{min-height:180px;padding:16px;background:#020617}#box{width:44px;height:44px;background:#38bdf8}button{margin-top:12px;padding:9px 14px}
</style></head><body><div class=card><h1>KUI C — Script 04 Lua Animation</h1><div id=output><div id=box></div></div><button id=action>Action</button></div>
<script type="text/lua">local b=document:getElementById('box'); local function f(t) b.style:setProperty('transform','translateX('..tostring(math.sin(t/400)*120+130)..'px)'); requestAnimationFrame(f) end; requestAnimationFrame(f)</script></body></html>
