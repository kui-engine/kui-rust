<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { padding: 24px; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; }
h2 { margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.demo { text-align: center; }
.demo .label { font-size: 12px; color: #94a3b8; margin-top: 8px; }
.box { width: 80px; height: 80px; background: #3b82f6; border-radius: 8px;
       margin: 20px auto; transition: transform 0.3s ease; }
.demo:nth-child(2) .box { background: #10b981; }
.demo:nth-child(3) .box { background: #f59e0b; }
.demo:nth-child(4) .box { background: #ef4444; }
.demo:nth-child(5) .box { background: #8b5cf6; }
.demo:nth-child(6) .box { background: #ec4899; }
.demo:nth-child(7) .box { background: #06b6d4; }
.demo:nth-child(8) .box { background: #d946ef; }
.t-rotate .box:hover { transform: rotate(45deg); }
.t-scale .box:hover { transform: scale(1.5); }
.t-skew .box:hover { transform: skewX(20deg); }
.t-translate .box:hover { transform: translateX(30px); }
.t-multi .box:hover { transform: rotate(180deg) scale(0.8); }
.t-3d .box:hover { transform: perspective(200px) rotateY(30deg); }
.t-origin .box { transform-origin: top left; }
.t-origin .box:hover { transform: rotate(30deg); }
.t-combo .box:hover { transform: scale(1.2) rotate(15deg) translateY(-10px); }
</style></head><body>
<h2>CSS Transforms (hover to activate)</h2>
<div class="grid">
  <div class="demo t-rotate"><div class="box"></div><div class="label">rotate(45deg)</div></div>
  <div class="demo t-scale"><div class="box"></div><div class="label">scale(1.5)</div></div>
  <div class="demo t-skew"><div class="box"></div><div class="label">skewX(20deg)</div></div>
  <div class="demo t-translate"><div class="box"></div><div class="label">translateX(30px)</div></div>
  <div class="demo t-multi"><div class="box"></div><div class="label">rotate + scale</div></div>
  <div class="demo t-3d"><div class="box"></div><div class="label">perspective + rotateY</div></div>
  <div class="demo t-origin"><div class="box"></div><div class="label">origin: top left</div></div>
  <div class="demo t-combo"><div class="box"></div><div class="label">combo transform</div></div>
</div>
</body></html>
