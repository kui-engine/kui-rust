<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);color:#f8fafc;height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
.art{width:280px;height:280px;border-radius:20px;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 50%,#ec4899 100%);margin-bottom:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(59,130,246,.3)}
.art .note{font-size:64px;opacity:.3}
.info{text-align:center;margin-bottom:24px}
.info h2{font-size:20px;margin-bottom:4px}.info .artist{font-size:14px;color:#94a3b8}
.progress{width:280px;margin-bottom:16px}
.prog-bar{height:4px;background:#334155;border-radius:2px;overflow:hidden;margin-bottom:4px}
.prog-fill{height:100%;background:#3b82f6;border-radius:2px;width:35%}
.prog-time{display:flex;justify-content:space-between;font-size:11px;color:#64748b}
.controls{display:flex;align-items:center;gap:24px;margin-bottom:24px}
.ctrl-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#94a3b8;background:transparent}
.ctrl-btn:hover{color:#f8fafc}
.ctrl-btn.play{width:56px;height:56px;background:#3b82f6;color:white;font-size:22px;box-shadow:0 4px 20px rgba(59,130,246,.4)}
.playlist{width:100%;max-width:320px}
.playlist h3{font-size:13px;color:#64748b;margin-bottom:8px}
.track{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px;color:#94a3b8}
.track:hover{background:#1e293b;color:#f8fafc}
.track.active{color:#3b82f6}
.track .num{width:20px;text-align:right;font-size:12px}
.track .dur{margin-left:auto;font-size:12px}
</style></head><body>
<div class="art"><div class="note">♪</div></div>
<div class="info"><h2>Midnight Dreams</h2><div class="artist">Synthwave Collective</div></div>
<div class="progress"><div class="prog-bar"><div class="prog-fill" id="progFill"></div></div><div class="prog-time"><span id="curTime">1:23</span><span>3:45</span></div></div>
<div class="controls">
<div class="ctrl-btn">⏮</div>
<div class="ctrl-btn play" id="playBtn">▶</div>
<div class="ctrl-btn">⏭</div>
</div>
<div class="playlist"><h3>Up Next</h3>
<div class="track active"><span class="num">1</span>Midnight Dreams<span class="dur">3:45</span></div>
<div class="track"><span class="num">2</span>Neon Lights<span class="dur">4:12</span></div>
<div class="track"><span class="num">3</span>Digital Sunrise<span class="dur">3:28</span></div>
<div class="track"><span class="num">4</span>Retrowave<span class="dur">5:01</span></div>
</div>
</body></html>
