<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cur{padding:16px;border-radius:8px;background:#f1f5f9;text-align:center;font-size:12px;color:#475569;font-weight:500;border:2px solid transparent}
.cur:hover{border-color:#3b82f6;background:#dbeafe}
</style></head><body>
<h2>CSS Cursor Styles</h2>
<div class="card"><h3>General</h3>
<div class="grid">
<div class="cur" style="cursor:default">default</div>
<div class="cur" style="cursor:pointer">pointer</div>
<div class="cur" style="cursor:crosshair">crosshair</div>
<div class="cur" style="cursor:move">move</div>
<div class="cur" style="cursor:text">text</div>
<div class="cur" style="cursor:wait">wait</div>
<div class="cur" style="cursor:help">help</div>
<div class="cur" style="cursor:not-allowed">not-allowed</div>
</div></div>
<div class="card"><h3>Resize</h3>
<div class="grid">
<div class="cur" style="cursor:n-resize">n-resize</div>
<div class="cur" style="cursor:s-resize">s-resize</div>
<div class="cur" style="cursor:e-resize">e-resize</div>
<div class="cur" style="cursor:w-resize">w-resize</div>
<div class="cur" style="cursor:ne-resize">ne-resize</div>
<div class="cur" style="cursor:nw-resize">nw-resize</div>
<div class="cur" style="cursor:col-resize">col-resize</div>
<div class="cur" style="cursor:row-resize">row-resize</div>
</div></div>
<div class="card"><h3>Other</h3>
<div class="grid">
<div class="cur" style="cursor:grab">grab</div>
<div class="cur" style="cursor:grabbing">grabbing</div>
<div class="cur" style="cursor:zoom-in">zoom-in</div>
<div class="cur" style="cursor:zoom-out">zoom-out</div>
</div></div>
</body></html>
