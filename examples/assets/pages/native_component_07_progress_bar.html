<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;padding:24px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:16px}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.pb{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:8px}
.pf{height:100%;border-radius:6px;transition:width .3s}
.pb-thin{height:4px}.pb-thick{height:20px}
.lbl{font-size:12px;color:#94a3b8;margin-bottom:12px}
.steps{display:flex;gap:4px;margin-bottom:8px}
.step{flex:1;height:6px;border-radius:3px;background:#e2e8f0}
.step.done{background:#10b981}.step.cur{background:#3b82f6}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
.bp{background:#3b82f6;color:white}.br{background:#ef4444;color:white}
</style></head><body>
<h2>Progress Bar</h2>
<div class="card"><h3>Animated progress</h3>
<div class="pb"><div class="pf" id="pf1" style="width:0%;background:#3b82f6"></div></div>
<div class="lbl" id="lbl1">0%</div>
<div class="btn-row"><button class="btn bp" id="startBtn">Start</button><button class="btn br" id="resetBtn">Reset</button></div></div>
<div class="card"><h3>Sizes</h3>
<div class="pb pb-thin"><div class="pf" style="width:60%;background:#10b981"></div></div><div class="lbl">Thin — 60%</div>
<div class="pb"><div class="pf" style="width:45%;background:#f59e0b"></div></div><div class="lbl">Default — 45%</div>
<div class="pb pb-thick"><div class="pf" style="width:75%;background:#ef4444"></div></div><div class="lbl">Thick — 75%</div></div>
<div class="card"><h3>Step progress</h3>
<div class="steps"><div class="step done"></div><div class="step done"></div><div class="step cur"></div><div class="step"></div><div class="step"></div></div>
<div class="lbl">Step 3 of 5</div></div>
</body></html>
