<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);height:100vh;display:flex;align-items:center;justify-content:center}
.container{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:24px}
.card{width:200px;border-radius:16px;padding:24px;color:white;text-align:center}
.card h3{font-size:16px;margin-bottom:8px}
.card p{font-size:12px;opacity:.8;line-height:1.5}
.blur{backdrop-filter:blur(12px);background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2)}
.bright{backdrop-filter:brightness(1.5);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}
.none{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(255,255,255,.2);margin-top:10px}
</style></head><body>
<div class="container">
<div class="card none"><h3>No Filter</h3><p>No backdrop-filter applied.</p><div class="tag">none</div></div>
<div class="card blur"><h3>Blur</h3><p>Frosted glass effect with blur.</p><div class="tag">blur(12px)</div></div>
<div class="card bright"><h3>Brightness</h3><p>Backdrop brightness increased.</p><div class="tag">brightness(1.5)</div></div>
</div>
</body></html>
