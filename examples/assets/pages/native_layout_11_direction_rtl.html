<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.sample{background:#f1f5f9;border-radius:8px;padding:16px;font-size:14px;color:#475569;line-height:1.6;margin-bottom:8px}
.flex-row{display:flex;gap:8px;margin-bottom:8px}
.flex-item{flex:1;padding:12px;border-radius:6px;text-align:center;font-size:13px;font-weight:600;color:white}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#dbeafe;color:#1e40af}
</style></head><body>
<h2>CSS direction: RTL</h2>
<div class="row">
<div class="card"><h3>LTR (Default)</h3>
<div class="sample" style="direction:ltr">Left-to-right text. Start edge on the left, content flows left to right.</div>
<div class="flex-row" style="direction:ltr">
<div class="flex-item" style="background:#3b82f6">1st</div>
<div class="flex-item" style="background:#10b981">2nd</div>
<div class="flex-item" style="background:#f59e0b">3rd</div></div>
<div class="tag">direction: ltr</div></div>
<div class="card"><h3>RTL</h3>
<div class="sample" style="direction:rtl">Right-to-left text. Start edge on the right, as in Arabic and Hebrew.</div>
<div class="flex-row" style="direction:rtl">
<div class="flex-item" style="background:#3b82f6">1st</div>
<div class="flex-item" style="background:#10b981">2nd</div>
<div class="flex-item" style="background:#f59e0b">3rd</div></div>
<div class="tag">direction: rtl</div></div>
</div>
</body></html>
