<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc;height:100vh;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:#0f172a;border-bottom:1px solid #1e293b}
.toolbar .path{flex:1;padding:6px 12px;border-radius:6px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:12px;font-family:"Consolas",monospace}
.toolbar .btn{padding:6px 12px;border-radius:6px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:12px;cursor:pointer}
.content{flex:1;display:flex;overflow:hidden}
.side{width:200px;background:#0f172a;border-right:1px solid #1e293b;padding:8px;overflow-y:auto}
.side .fav{padding:8px 12px;border-radius:6px;font-size:13px;color:#94a3b8;cursor:pointer;margin-bottom:2px}
.side .fav:hover{background:#1e293b;color:#f8fafc}.side .fav.a{background:#1e293b;color:#f8fafc}
.side h4{font-size:11px;color:#475569;padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.5px}
.files{flex:1;padding:12px;overflow-y:auto}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.file-item{padding:12px;border-radius:8px;text-align:center;cursor:pointer;font-size:12px;color:#94a3b8}
.file-item:hover{background:#1e293b;color:#f8fafc}
.file-item .icon{font-size:28px;margin-bottom:6px}
.file-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusbar{padding:6px 16px;background:#0f172a;border-top:1px solid #1e293b;font-size:11px;color:#64748b;display:flex;justify-content:space-between}
</style></head><body>
<div class="toolbar">
<div class="btn" id="backBtn">←</div>
<div class="path">C:\Projects</div>
<div class="btn">View ▼</div>
</div>
<div class="content">
<div class="side">
<h4>Favorites</h4>
<div class="fav a">Desktop</div><div class="fav">Documents</div><div class="fav">Downloads</div><div class="fav">Pictures</div>
<h4>Drives</h4>
<div class="fav">C: Drive</div><div class="fav">D: Drive</div>
</div>
<div class="files">
<div class="file-grid">
<div class="file-item"><div class="icon">📁</div><div class="name">src</div></div>
<div class="file-item"><div class="icon">📁</div><div class="name">include</div></div>
<div class="file-item"><div class="icon">📁</div><div class="name">tests</div></div>
<div class="file-item"><div class="icon">📁</div><div class="name">docs</div></div>
<div class="file-item"><div class="icon">📁</div><div class="name">build</div></div>
<div class="file-item"><div class="icon">📄</div><div class="name">CMakeLists.txt</div></div>
<div class="file-item"><div class="icon">📄</div><div class="name">README.md</div></div>
<div class="file-item"><div class="icon">📄</div><div class="name">CHANGELOG.md</div></div>
<div class="file-item"><div class="icon">📄</div><div class="name">main.cpp</div></div>
<div class="file-item"><div class="icon">📄</div><div class="name">config.json</div></div>
<div class="file-item"><div class="icon">🖼</div><div class="name">logo.png</div></div>
<div class="file-item"><div class="icon">📄</div><div class="name">LICENSE</div></div>
</div></div></div>
<div class="statusbar"><span>12 items</span><span>3.2 GB free</span></div>
</body></html>
