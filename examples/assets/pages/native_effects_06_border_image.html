<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:20px;text-align:center;background:white}.card .nm{font-size:12px;color:#64748b;margin-top:8px}
.s1{border:3px solid #3b82f6;border-radius:8px}
.s2{border:3px dashed #10b981;border-radius:8px}
.s3{border:3px dotted #f59e0b;border-radius:8px}
.s4{border:4px double #ef4444;border-radius:8px}
.s5{border:4px groove #8b5cf6;border-radius:8px}
.s6{border:4px ridge #ec4899;border-radius:8px}
.s7{border:4px inset #06b6d4;border-radius:8px}
.s8{border:4px outset #f59e0b;border-radius:8px}
.s9{border-top:3px solid #3b82f6;border-right:3px dashed #10b981;border-bottom:3px dotted #f59e0b;border-left:3px double #ef4444;border-radius:8px}
</style></head><body><h2>Border Styles</h2>
<div class="grid">
<div class="card s1"><div class="nm">solid</div></div>
<div class="card s2"><div class="nm">dashed</div></div>
<div class="card s3"><div class="nm">dotted</div></div>
<div class="card s4"><div class="nm">double</div></div>
<div class="card s5"><div class="nm">groove</div></div>
<div class="card s6"><div class="nm">ridge</div></div>
<div class="card s7"><div class="nm">inset</div></div>
<div class="card s8"><div class="nm">outset</div></div>
<div class="card s9"><div class="nm">mixed</div></div>
</div></body></html>
