<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:16px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:12px}
.s{background:white;padding:16px;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.s h3{font-size:13px;color:#64748b;margin-bottom:8px}
.demo{background:#f1f5f9;padding:12px;border-radius:6px;line-height:2}
.demo span{padding:4px 8px;border-radius:4px;font-size:13px}
.t-b{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.t-g{background:#dcfce7;color:#166534;border:1px solid #86efac}
.t-a{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.t-r{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.ib{background:#f1f5f9;padding:12px;border-radius:6px}
.ib-box{display:inline-block;width:100px;height:60px;margin:4px;border-radius:6px;text-align:center;line-height:60px;color:white;font-size:12px;font-weight:600;vertical-align:middle}
</style></head><body>
<h2>Inline Flow Layout</h2>
<div class="s"><h3>Inline elements flow and wrap</h3>
<div class="demo">
<span class="t-b">HTML</span> <span class="t-g">CSS</span> <span class="t-a">JS</span> <span class="t-r">C++</span>
<span class="t-b">Flex</span> <span class="t-g">Grid</span> <span class="t-a">Anim</span> <span class="t-r">Canvas</span>
<span class="t-b">WebGL</span> <span class="t-g">DOM</span> <span class="t-a">Events</span> <span class="t-r">Layout</span>
</div></div>
<div class="s"><h3>inline-block: inline flow with block sizing</h3>
<div class="ib">
<div class="ib-box" style="background:#3b82f6">Box A</div>
<div class="ib-box" style="background:#10b981;height:80px;line-height:80px">Taller</div>
<div class="ib-box" style="background:#f59e0b;width:140px">Wider</div>
<div class="ib-box" style="background:#ef4444">Box D</div>
<div class="ib-box" style="background:#8b5cf6;width:120px">Box E</div>
</div></div>
</body></html>
