<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { padding: 24px; font-family: "Segoe UI", sans-serif; background: #f1f5f9; }
h2 { margin-bottom: 16px; color: #1e293b; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.card { background: white; padding: 24px; border-radius: 12px; text-align: center; }
.card .label { font-size: 12px; color: #64748b; margin-top: 12px; }
.s1 { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.s2 { box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
.s3 { box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.s4 { box-shadow: inset 0 2px 8px rgba(0,0,0,0.2); }
.s5 { box-shadow: 0 0 0 4px #3b82f6; }
.s6 { box-shadow: 5px 5px 0 #1e293b; }
.s7 { box-shadow: 0 4px 12px rgba(59,130,246,0.5); }
.s8 { box-shadow: 0 0 20px rgba(236,72,153,0.6), 0 0 40px rgba(139,92,246,0.3); }
.text-shadow { font-size: 36px; font-weight: 700; margin-bottom: 16px; }
.ts1 { text-shadow: 2px 2px 4px rgba(0,0,0,0.3); color: #1e293b; }
.ts2 { text-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6; color: #3b82f6; }
</style></head><body>
<h2>Box Shadows</h2>
<div class="grid">
  <div class="card s1"><div class="label">Subtle</div></div>
  <div class="card s2"><div class="label">Medium</div></div>
  <div class="card s3"><div class="label">Heavy</div></div>
  <div class="card s4"><div class="label">Inset</div></div>
  <div class="card s5"><div class="label">Ring</div></div>
  <div class="card s6"><div class="label">Hard offset</div></div>
  <div class="card s7"><div class="label">Color shadow</div></div>
  <div class="card s8"><div class="label">Multi glow</div></div>
</div>
<h2>Text Shadows</h2>
<p class="text-shadow ts1">Drop Shadow Text</p>
<p class="text-shadow ts2">Neon Glow Text</p>
</body></html>
