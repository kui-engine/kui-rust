<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.swatch{height:120px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;background:linear-gradient(135deg,#3b82f6 0%,#ef4444 100%)}
.swatch span{background:rgba(0,0,0,.6);color:white;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:12px}
</style></head><body>
<h2>Background Blend Modes</h2>
<div class="grid">
<div class="swatch" style="background-blend-mode:normal"><span>normal</span></div>
<div class="swatch" style="background-blend-mode:multiply"><span>multiply</span></div>
<div class="swatch" style="background-blend-mode:screen"><span>screen</span></div>
<div class="swatch" style="background-blend-mode:overlay"><span>overlay</span></div>
<div class="swatch" style="background-blend-mode:darken"><span>darken</span></div>
<div class="swatch" style="background-blend-mode:lighten"><span>lighten</span></div>
<div class="swatch" style="background-blend-mode:color-dodge"><span>color-dodge</span></div>
<div class="swatch" style="background-blend-mode:difference"><span>difference</span></div>
<div class="swatch" style="background-blend-mode:exclusion"><span>exclusion</span></div>
<div class="swatch" style="background-blend-mode:hard-light"><span>hard-light</span></div>
<div class="swatch" style="background-blend-mode:soft-light"><span>soft-light</span></div>
<div class="swatch" style="background-blend-mode:color-burn"><span>color-burn</span></div>
</div>
<div class="info">Each swatch uses the same gradient with different blend modes.</div>
</body></html>
