<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.swatch{width:80px;height:60px;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.swatch span{font-size:9px;font-weight:600;color:white;text-shadow:0 1px 2px rgba(0,0,0,.3);text-align:center}
.palette{display:flex;border-radius:8px;overflow:hidden;margin-bottom:8px}
.palette div{flex:1;height:48px}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:8px}
</style></head><body>
<h2>CSS Color Formats</h2>
<div class="card"><h3>Named Colors</h3>
<div class="row">
<div class="swatch" style="background:red"><span>red</span></div>
<div class="swatch" style="background:blue"><span>blue</span></div>
<div class="swatch" style="background:green"><span>green</span></div>
<div class="swatch" style="background:orange"><span>orange</span></div>
<div class="swatch" style="background:purple"><span>purple</span></div>
<div class="swatch" style="background:coral"><span>coral</span></div>
<div class="swatch" style="background:teal"><span>teal</span></div>
<div class="swatch" style="background:tomato"><span>tomato</span></div>
</div></div>
<div class="card"><h3>Hex Colors</h3>
<div class="row">
<div class="swatch" style="background:#3b82f6"><span>#3b82f6</span></div>
<div class="swatch" style="background:#10b981"><span>#10b981</span></div>
<div class="swatch" style="background:#f59e0b"><span>#f59e0b</span></div>
<div class="swatch" style="background:#ef4444"><span>#ef4444</span></div>
<div class="swatch" style="background:#8b5cf6"><span>#8b5cf6</span></div>
</div></div>
<div class="card"><h3>RGB / RGBA</h3>
<div class="row">
<div class="swatch" style="background:rgb(59,130,246)"><span>rgb(59,130,246)</span></div>
<div class="swatch" style="background:rgba(59,130,246,0.7)"><span>rgba(..,0.7)</span></div>
<div class="swatch" style="background:rgba(59,130,246,0.4)"><span>rgba(..,0.4)</span></div>
<div class="swatch" style="background:rgba(239,68,68,0.8)"><span>rgba(..,0.8)</span></div>
</div></div>
<div class="card"><h3>HSL Hue Wheel</h3>
<div class="palette">
<div style="background:hsl(0,80%,60%)"></div><div style="background:hsl(40,80%,60%)"></div><div style="background:hsl(80,80%,60%)"></div>
<div style="background:hsl(120,80%,60%)"></div><div style="background:hsl(160,80%,60%)"></div><div style="background:hsl(200,80%,60%)"></div>
<div style="background:hsl(240,80%,60%)"></div><div style="background:hsl(280,80%,60%)"></div><div style="background:hsl(320,80%,60%)"></div>
</div>
<div class="info">HSL: rotate hue 0-360. Same saturation and lightness, different hues.</div></div>
</body></html>
