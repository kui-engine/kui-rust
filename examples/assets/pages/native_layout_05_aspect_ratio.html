<!DOCTYPE html><html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:24px;font-family:"Segoe UI",sans-serif;background:#f8fafc}
h2{color:#1e293b;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.box{border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:13px;flex-direction:column;gap:4px;text-align:center}
.box .ratio{font-size:20px}.box .label{font-size:11px;opacity:.7}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:13px;color:#64748b;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.thumb{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:600}
.info{background:#f1f5f9;border-radius:8px;padding:10px;font-size:12px;color:#64748b;margin-top:12px}
</style></head><body>
<h2>CSS aspect-ratio</h2>
<div class="grid">
<div class="box" style="aspect-ratio:1/1;background:#3b82f6"><div class="ratio">1:1</div><div class="label">Square</div></div>
<div class="box" style="aspect-ratio:16/9;background:#10b981"><div class="ratio">16:9</div><div class="label">Widescreen</div></div>
<div class="box" style="aspect-ratio:4/3;background:#f59e0b"><div class="ratio">4:3</div><div class="label">Classic</div></div>
<div class="box" style="aspect-ratio:3/2;background:#8b5cf6"><div class="ratio">3:2</div><div class="label">Photo</div></div>
<div class="box" style="aspect-ratio:21/9;background:#ef4444"><div class="ratio">21:9</div><div class="label">Ultrawide</div></div>
<div class="box" style="aspect-ratio:9/16;background:#ec4899"><div class="ratio">9:16</div><div class="label">Portrait</div></div>
</div>
<div class="card"><h3>Responsive Thumbnails</h3>
<div class="row">
<div class="thumb" style="width:120px;aspect-ratio:16/9;background:#3b82f6">16:9</div>
<div class="thumb" style="width:120px;aspect-ratio:1/1;background:#10b981">1:1</div>
<div class="thumb" style="width:120px;aspect-ratio:4/3;background:#f59e0b">4:3</div>
</div>
<div class="info">aspect-ratio maintains proportions regardless of width. Great for video, cards, images.</div></div>
</body></html>
