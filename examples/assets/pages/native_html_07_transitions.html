<!DOCTYPE html>
<html><head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { padding: 24px; font-family: "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; }
h2 { margin-bottom: 16px; }
.demo { display: flex; gap: 24px; flex-wrap: wrap; }
.card { background: #1e293b; padding: 16px; border-radius: 12px; text-align: center; width: 180px; }
.card h3 { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
.box { width: 80px; height: 80px; border-radius: 8px; margin: 0 auto;
       transition: all 0.3s ease; cursor: pointer; }
.bg-trans { background: #3b82f6; }
.bg-trans:hover { background: #ef4444; }
.scale-trans { background: #10b981; }
.scale-trans:hover { transform: scale(1.3); }
.rotate-trans { background: #f59e0b; }
.rotate-trans:hover { transform: rotate(45deg); }
.radius-trans { background: #8b5cf6; }
.radius-trans:hover { border-radius: 50%; }
.opacity-trans { background: #ec4899; }
.opacity-trans:hover { opacity: 0.3; }
.shadow-trans { background: #06b6d4; }
.shadow-trans:hover { box-shadow: 0 0 20px rgba(6,182,212,0.8); }
.multi-trans { background: #d946ef; transition: all 0.5s ease; }
.multi-trans:hover { transform: scale(1.2) rotate(180deg); background: #3b82f6; border-radius: 50%; }
</style></head><body>
<h2>CSS Transitions</h2>
<div class="demo">
  <div class="card"><h3>Background</h3><div class="box bg-trans"></div></div>
  <div class="card"><h3>Scale</h3><div class="box scale-trans"></div></div>
  <div class="card"><h3>Rotate</h3><div class="box rotate-trans"></div></div>
  <div class="card"><h3>Border Radius</h3><div class="box radius-trans"></div></div>
  <div class="card"><h3>Opacity</h3><div class="box opacity-trans"></div></div>
  <div class="card"><h3>Box Shadow</h3><div class="box shadow-trans"></div></div>
  <div class="card"><h3>Multi-prop</h3><div class="box multi-trans"></div></div>
</div>
</body></html>
