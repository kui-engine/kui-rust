<html><body>
<div id="result">FAIL</div>
<div id="root">
    <div id="child1">A</div>
    <div id="child2">B</div>
    <div id="child3">C</div>
</div>
<script type="text/lua">
local ok = true

local root = document:getElementById("root")
local c2 = document:getElementById("child2")

-- Verify child2 exists
ok = ok and (c2 ~= nil)

-- Count children before
local before = root.childElementCount
ok = ok and (before == 3)

-- remove() — detach from parent
c2:remove()

-- Count children after
local after = root.childElementCount
ok = ok and (after == 2)

-- child2 no longer in DOM (querySelector returns nil)
local found = document:getElementById("child2")
ok = ok and (found == nil)

-- Remaining children
local ch = root:children()
ok = ok and (#ch == 2)

document:getElementById("result").textContent = ok and "PASS" or "FAIL"
</script>
</body></html>
