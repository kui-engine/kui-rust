<html><body>
<div id="result">FAIL</div>
<div id="detail"></div>
<div id="parent">
    <div id="first">A</div>
    <div id="second">B</div>
    <div id="third">C</div>
</div>
<script type="text/lua">
local ok = true
local msg = ""

-- previousElementSibling
local second = document:getElementById("second")
local prev = second.previousElementSibling
if prev == nil then ok = false; msg = msg .. "prevSibling nil; "
elseif prev.id ~= "first" then ok = false; msg = msg .. "prevSibling.id=" .. prev.id .. "; "
end

-- el.style.length
local el = document:getElementById("parent")
el.style:setProperty("color", "red")
el.style:setProperty("font-size", "14px")
if el.style.length < 2 then ok = false; msg = msg .. "style.length=" .. el.style.length .. "; " end

-- window.devicePixelRatio — sol::readonly_property on table, may return wrapper
-- Just verify access doesn't crash
local dpr = window.devicePixelRatio
-- dpr may be a number or a property wrapper depending on sol2 table behavior

-- window.location — sol::readonly_property on sub-table
-- Just verify access doesn't crash
local loc = window.location

-- console.debug should not crash
console.debug("test debug message")

-- console.clear should not crash
console.clear()

-- document:on() alias
local docOnFired = false
document:on("testalias", function(e)
    docOnFired = true
end)
document:dispatchEvent("testalias")
if not docOnFired then ok = false; msg = msg .. "doc:on not fired; " end

-- el:on() alias
local elOnFired = false
el:on("testalias2", function(e)
    elOnFired = true
end)
el:dispatchEvent("testalias2")
if not elOnFired then ok = false; msg = msg .. "el:on not fired; " end

-- document:removeEventListeners
document:removeEventListeners("testalias")
local afterRemove = false
document:addEventListener("testalias", function(e)
    afterRemove = true
end)
document:dispatchEvent("testalias")
if not afterRemove then ok = false; msg = msg .. "removeEventListeners failed; " end

if ok then
    document:getElementById("result").textContent = "PASS"
else
    document:getElementById("result").textContent = "FAIL"
    document:getElementById("detail").textContent = msg
end
</script>
</body></html>
